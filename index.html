<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪獸貼紙牆</title>
<style>
  :root{
    --navy:#191A2E;
    --cream:#FDF6EA;
    --white:#FFFFFF;
    --peach:#F5A661;
    --coral:#FF6B5E;
    --purple:#6B5ECF;
    --row-bg:#FBF2E2;
    --muted:#9A9584;
    --disabled-bg:#EDEAE2;
    --disabled-text:#ACA89B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ overflow-x:hidden; }
  body{
    font-family:'PingFang TC','Microsoft JhengHei','Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--navy);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  .page-blob-tl{ position:absolute; top:0; left:0; width:130px; height:88px; z-index:0; pointer-events:none; opacity:.9; }
  .sparkle{ position:absolute; z-index:0; pointer-events:none; opacity:.5; }

  .wrap{ max-width:430px; margin:0 auto; padding:26px 18px 70px; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom:20px; }
  .title{ font-size:22px; font-weight:800; color:var(--navy); }
  .subtitle{ margin-top:6px; font-size:13px; color:#A79A87; font-weight:500; }

  .name-row{ display:flex; gap:10px; margin-bottom:22px; }
  .name-input-wrap{ flex:1; position:relative; height:56px; }
  .name-input-wrap .cat-icon{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:24px; height:24px; pointer-events:none; }
  .name-input-wrap input{
    width:100%; height:100%;
    border:1.5px solid #ECE6D8;
    border-radius:18px;
    padding:0 16px 0 48px;
    font-size:14px; font-weight:500;
    background:var(--white); color:var(--navy);
  }
  .name-input-wrap input::placeholder{ color:var(--muted); }
  .name-input-wrap input:focus{ outline:none; border-color:var(--peach); }
  .save-btn{
    height:56px; border:none; border-radius:18px;
    background:var(--peach); color:var(--navy);
    font-weight:700; font-size:14px; padding:0 24px; cursor:pointer;
  }
  .save-btn:active{ transform:scale(.97); }

  .card{
    position:relative;
    background:var(--white);
    border-radius:26px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(25,26,46,.06);
  }
  .card-header{
    background:var(--navy);
    border-radius:26px 26px 0 0;
    padding:18px 20px;
    display:flex; align-items:center; gap:10px;
  }
  .card-header h2{ color:#fff; font-size:16.5px; font-weight:800; }
  .plain-head{ padding:20px 20px 4px; display:flex; align-items:center; gap:10px; }
  .plain-head h2{ font-size:16.5px; font-weight:800; color:var(--navy); }
  .pill{ background:var(--coral); color:#fff; font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px; }
  .peek-blob{ position:absolute; top:-15px; right:-6px; width:72px; height:62px; z-index:2; pointer-events:none; }
  .card-body{ padding:16px 18px 20px; }

  .task-list{ display:flex; flex-direction:column; gap:9px; }
  .task{
    display:flex; align-items:center; gap:12px;
    padding:9px 10px;
    background:var(--row-bg);
    border-radius:20px;
  }
  .task-icon{ width:52px; height:52px; border-radius:50%; border:2px solid var(--navy); flex-shrink:0; overflow:hidden; }
  .task-icon svg{ width:100%; height:100%; display:block; }
  .task .label{ flex:1; font-size:13.5px; font-weight:700; color:var(--navy); }
  .stamp-btn{
    border:none; border-radius:14px;
    font-weight:700; font-size:12px; padding:9px 15px;
    cursor:pointer; white-space:nowrap;
    background:var(--peach); color:var(--navy);
  }
  .stamp-btn:disabled{ background:var(--disabled-bg); color:var(--disabled-text); cursor:default; }
  .stamp-btn:not(:disabled):active{ transform:scale(.94); }
  .remove-btn{ border:none; background:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0 2px; }

  .add-task{ display:flex; gap:9px; margin-top:12px; }
  .add-task-input-wrap{ flex:1; position:relative; height:50px; }
  .add-task-input-wrap .plus-icon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border-radius:50%;
    background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; pointer-events:none;
  }
  .add-task-input-wrap input{
    width:100%; height:100%;
    border:1.5px dashed #DCD3BE;
    border-radius:16px;
    padding:0 14px 0 44px;
    font-size:12.5px; background:transparent; color:var(--navy);
  }
  .add-task-input-wrap input::placeholder{ color:#C7BEA9; }
  .add-btn{
    height:50px; border:none; border-radius:14px;
    background:var(--purple); color:#fff;
    font-weight:700; font-size:12.5px; padding:0 18px; cursor:pointer;
  }
  .add-btn:active{ transform:scale(.96); }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:11px; }
  .progress-row .label{ font-size:13px; font-weight:600; color:#8B8578; }
  .progress-row .count{ font-weight:800; font-size:14.5px; color:var(--navy); }
  .progress-track{
    height:15px; border-radius:10px;
    background:var(--cream); overflow:hidden; position:relative;
  }
  .progress-fill{
    height:100%; border-radius:10px;
    background-color:var(--peach);
    background-image:radial-gradient(circle, rgba(255,255,255,.55) 2px, transparent 2px);
    background-size:10px 10px;
    transition:width .35s ease;
  }
  .threshold-row{ display:flex; align-items:center; gap:8px; margin-top:15px; font-size:12.5px; font-weight:600; color:#8B8578; }
  .threshold-row input{
    width:48px; border:1.5px solid #ECE6D8; border-radius:10px;
    padding:5px 6px; font-weight:800; text-align:center; color:var(--navy);
  }
  .redeem-btn{
    width:100%; margin-top:16px; border:none; border-radius:16px;
    font-weight:700; font-size:14px; padding:14px; cursor:pointer;
    background:var(--disabled-bg); color:var(--disabled-text);
  }
  .redeem-btn.ready{ background:var(--peach); color:var(--navy); }
  .redeem-btn:not(:disabled):active{ transform:scale(.98); }

  .sticker-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:9px; }
  .sticker-slot{
    aspect-ratio:1; border-radius:16px;
    background:var(--white); border:1.5px dashed #E7E0D0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .sticker-slot.filled{ border:2px solid var(--navy); animation:pop .35s ease; }
  .sticker-slot svg{ width:72%; height:72%; }
  .sticker-slot img{
    width:78%;
    height:78%;
    object-fit:contain;
    display:block;
  }
  @keyframes pop{
    0%{ transform:scale(.7); opacity:0; }
    70%{ transform:scale(1.06); }
    100%{ transform:scale(1); opacity:1; }
  }
  .empty-hint{ text-align:center; font-size:12px; color:var(--muted); padding:16px 0; }

  .toast{
    position:fixed; left:50%; bottom:30px; transform:translate(-50%, 20px);
    background:var(--navy); color:#fff; font-weight:600; font-size:13px;
    padding:12px 22px; border-radius:30px; opacity:0;
    transition:all .3s ease; pointer-events:none;
    box-shadow:0 10px 24px rgba(25,26,46,.25); white-space:nowrap; z-index:100;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---- 蓋章儀式 ---- */
  .stamp-overlay{
    position:fixed; inset:0;
    background:radial-gradient(circle at 50% 40%, #262844 0%, #191A2E 55%, #101120 100%);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:50;
  }
  .stamp-overlay.show{ opacity:1; pointer-events:auto; }
  .overlay-close{
    position:absolute; top:24px; right:24px; width:38px; height:38px; border-radius:50%;
    border:1.5px solid rgba(245,166,97,.6); background:transparent; color:var(--peach);
    font-size:16px; font-weight:600; cursor:pointer;
  }
  .stamp-card{ text-align:center; }
  .stamp-hint{ color:#F3EFE6; font-weight:700; font-size:16.5px; margin-bottom:8px; }
  .scan-text{
    height:20px; margin-bottom:18px; font-weight:700; font-size:12.5px; letter-spacing:3px;
    opacity:0; transition:opacity .2s ease; color:var(--peach);
  }
  .scan-text.active{ opacity:.9; animation:pulseText 1s ease-in-out infinite; }
  @keyframes pulseText{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
  .scan-text .dots span{ animation:dotBlink 1.2s infinite; opacity:0; }
  .scan-text .dots span:nth-child(2){ animation-delay:.2s; }
  .scan-text .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes dotBlink{ 0%,100%{ opacity:0; } 50%{ opacity:1; } }
  .stamp-pad-wrap{ position:relative; width:min(64vw, 260px); height:min(78vw, 320px); margin:0 auto; }
  .pad-glow{
    position:absolute; inset:-15%; border-radius:50%;
    background:radial-gradient(circle, rgba(245,166,97,.28) 0%, rgba(245,166,97,.06) 55%, transparent 75%);
    filter:blur(4px); pointer-events:none;
  }
  .hud-ring{
    position:absolute; inset:6%; border-radius:50%;
    border:1.5px dashed rgba(245,166,97,.28); pointer-events:none; animation:ringSpin 20s linear infinite;
    transition:opacity .3s ease;
  }
  .hud-ring.ring2{ inset:-2%; border-color:rgba(245,166,97,.14); border-style:dotted; animation:ringSpin 28s linear infinite reverse; }
  @keyframes ringSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .stamp-pad-wrap.pressing .hud-ring{ border-color:rgba(245,166,97,.8); }
  .stamp-pad-wrap.landed .hud-ring{ opacity:0; }
  .stamp-pad-wrap.landed .pad-glow{ opacity:0; transition:opacity .3s ease; }
  .stamp-pad{ position:absolute; inset:0; touch-action:none; cursor:pointer; user-select:none; -webkit-user-select:none; transition:transform .15s ease; }
  .stamp-badge{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:130%; height:130%; object-fit:contain;
    opacity:0;
    pointer-events:none; z-index:3;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));
  }
  .stamp-badge.show{
    animation:stampPress .42s cubic-bezier(.5,0,.15,1) .25s forwards;
    transform-origin:center;
  }
  @keyframes stampPress{
    0%{ opacity:0; transform:translate(-50%,-50%) translateY(-85%) scale(1.12); }
    55%{ opacity:1; transform:translate(-50%,-50%) translateY(0%) scale(0.95); }
    72%{ transform:translate(-50%,-50%) translateY(0%) scale(1.05); }
    86%{ transform:translate(-50%,-50%) translateY(0%) scale(0.99); }
    100%{ opacity:1; transform:translate(-50%,-50%) translateY(0) scale(1); }
  }
  .stamp-impact{
    position:absolute; inset:0; margin:auto;
    width:130%; height:130%; border-radius:50%;
    pointer-events:none; z-index:2;
    opacity:0;
  }
  .stamp-impact.show{
    animation:impactFlash .4s ease .62s forwards;
  }
  @keyframes impactFlash{
    0%{ opacity:.55; background:radial-gradient(circle, rgba(245,166,97,.5) 0%, transparent 70%); transform:scale(.7); }
    100%{ opacity:0; background:radial-gradient(circle, rgba(245,166,97,.5) 0%, transparent 70%); transform:scale(1.3); }
  }
  .ripple-ring{
    position:absolute; inset:0; margin:auto;
    width:100%; height:100%; border-radius:50%;
    border:3px solid rgba(255,255,255,.8);
    pointer-events:none; z-index:2;
    opacity:0;
  }
  .ripple-ring.show{
    animation:rippleOut .55s cubic-bezier(.15,.7,.4,1) .6s forwards;
  }
  @keyframes rippleOut{
    0%{ opacity:.75; transform:scale(.55); border-width:5px; }
    100%{ opacity:0; transform:scale(1.35); border-width:0px; }
  }
  .stamp-card.shake{ animation:cardShake .3s ease .6s; }
  @keyframes cardShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-3px,1px); }
    40%{ transform:translate(3px,-1px); }
    60%{ transform:translate(-2px,1px); }
    80%{ transform:translate(2px,0); }
  }
  .stamp-pad svg{ width:100%; height:100%; display:block; overflow:visible; transition:opacity .25s ease; }
  .stamp-pad.pressing{ transform:scale(0.97); }
  .stamp-pad.done svg{ opacity:0; }
  .stamp-pad.done{ animation:stampDone .45s ease; }
  @keyframes stampDone{
    0%{ transform:scale(0.97); }
    50%{ transform:scale(1.1); filter:drop-shadow(0 0 18px rgba(245,166,97,.7)); }
    100%{ transform:scale(1); }
  }
  #scanBeam{ opacity:.5; }
  .stamp-pad.pressing #scanBeam{ opacity:.95; animation:scanSweep 1.5s ease-in-out infinite; }
  @keyframes scanSweep{ 0%{ transform:translateY(0); } 100%{ transform:translateY(304px); } }
  #ridgeGroup{ filter:drop-shadow(0 0 4px rgba(245,166,97,.5)); }
.identity-overlay{
  position:fixed; inset:0; z-index:200;
  background:rgba(25,26,46,.92);
  display:none; align-items:center; justify-content:center;
  padding:24px;
}
.identity-overlay.show{ display:flex; }
.identity-card{
  background:var(--cream); border-radius:24px; padding:28px 22px;
  max-width:340px; width:100%; text-align:center;
}
.identity-title{ font-size:20px; font-weight:800; color:var(--navy); margin-bottom:6px; }
.identity-sub{ font-size:13px; color:var(--muted); margin-bottom:20px; }
.identity-options{ display:flex; flex-direction:column; gap:10px; }
.identity-btn{
  padding:14px; border-radius:16px; border:2px solid #E7E0D0;
  background:var(--white); font-size:16px; font-weight:700; color:var(--navy);
  cursor:pointer;
}
.identity-btn:active{ transform:scale(.97); background:var(--peach); }
.identity-badge{
  position:fixed; top:14px; left:14px; z-index:50;
  background:var(--white); border-radius:999px; padding:6px 12px;
  font-size:12px; font-weight:700; color:var(--navy);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  display:flex; align-items:center; gap:4px; cursor:pointer;
}
.sticker-grid.unlimited{ display:flex; flex-wrap:wrap; gap:9px; }
.sticker-grid.unlimited .sticker-slot{ width:calc(20% - 7.2px); aspect-ratio:1; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

  function pickAvatarIdx(label){
    if(/刷牙|牙齒/.test(label)) return 0;
    if(/玩具|收拾|收/.test(label)) return 1;
    if(/飯|吃|挑食|餐/.test(label)) return 2;
    if(/穿|衣服/.test(label)) return 3;
    return null;
  }
  function taskIcon(label, idx){
    const i = pickAvatarIdx(label);
    const src = AVATAR_IMGS[i !== null ? i : idx % AVATAR_IMGS.length];
    return `<img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center;">`;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const IDENTITY_LABELS = { dad:'👨 爸爸', mom:'👩 媽媽', child:'🧒 小朋友' };

  let state = {
    kidName:'',
    tasks: [],
    completions:{},   // todayKey -> [taskId,...]
    stamps: [],       // 全部蓋章紀錄 {id, task_id, stamped_by, sticker_seed, stamped_at}
    redeemedTotal: 0, // 已兌換掉的貼紙總數
    threshold:10
  };

  function currentStickerCount(){
    return Math.max(0, state.stamps.length - state.redeemedTotal);
  }

  const $ = id => document.getElementById(id);
  const toastEl = $('toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1600);
  }

  let dbOK = true;
  let warnedOffline = false;

  function dbError(e){
    dbOK = false;
    console.error(e);
    if(!warnedOffline){
      warnedOffline = true;
      toast('連線失敗，請檢查網路後重新整理');
    }
  }

  // ---- 身份選擇（存在這支裝置的 localStorage，不同步） ----
  function getIdentity(){
    return localStorage.getItem('sticker-wall-identity');
  }
  function setIdentity(id){
    localStorage.setItem('sticker-wall-identity', id);
    renderIdentityBadge();
  }
  function renderIdentityBadge(){
    const id = getIdentity();
    const badge = $('identityBadge');
    if(id){
      badge.style.display = 'flex';
      badge.textContent = IDENTITY_LABELS[id] || id;
    } else {
      badge.style.display = 'none';
    }
  }
  function showIdentityPicker(){
    $('identityOverlay').classList.add('show');
  }
  $('identityOverlay').addEventListener('click', e=>{
    const btn = e.target.closest('.identity-btn');
    if(!btn) return;
    setIdentity(btn.dataset.id);
    $('identityOverlay').classList.remove('show');
  });
  $('identityBadge').addEventListener('click', showIdentityPicker);

  // ---- 讀取所有資料 ----
  async function load(){
    if(!getIdentity()) showIdentityPicker();
    renderIdentityBadge();
    try{
      const [tasksRes, stampsRes, redemptionsRes, settingsRes] = await Promise.all([
        sb.from('tasks').select('*').eq('family_code', FAMILY_CODE).order('sort_order', {ascending:true}).order('created_at', {ascending:true}),
        sb.from('stamps').select('*').eq('family_code', FAMILY_CODE).order('stamped_at', {ascending:true}),
        sb.from('redemptions').select('stickers_used').eq('family_code', FAMILY_CODE),
        sb.from('settings').select('*').eq('family_code', FAMILY_CODE).maybeSingle()
      ]);
      if(tasksRes.error) throw tasksRes.error;
      if(stampsRes.error) throw stampsRes.error;
      if(redemptionsRes.error) throw redemptionsRes.error;
      if(settingsRes.error) throw settingsRes.error;

      state.tasks = (tasksRes.data || []).map(t=>({id:t.id, label:t.label}));
      state.stamps = stampsRes.data || [];
      state.redeemedTotal = (redemptionsRes.data || []).reduce((sum,r)=>sum + (r.stickers_used||0), 0);
      state.completions = {};
      state.stamps.forEach(s=>{
        const day = (s.stamped_at || '').slice(0,10);
        if(!state.completions[day]) state.completions[day] = [];
        state.completions[day].push(s.task_id);
      });
      if(settingsRes.data){
        state.kidName = settingsRes.data.child_name || '';
        state.threshold = settingsRes.data.redeem_threshold || 10;
      }

      // 如果任務是空的（第一次使用），建立預設任務
      if(state.tasks.length === 0){
        const inserts = DEFAULT_TASKS.map((label, idx)=>({
          family_code: FAMILY_CODE, label, sort_order: idx
        }));
        const { data: created, error } = await sb.from('tasks').insert(inserts).select();
        if(!error && created){
          state.tasks = created.map(t=>({id:t.id, label:t.label}));
        }
      }
      dbOK = true;
    }catch(e){
      dbError(e);
    }
    render();
    subscribeRealtime();
  }

  let realtimeSubscribed = false;
  function subscribeRealtime(){
    if(realtimeSubscribed) return;
    realtimeSubscribed = true;
    sb.channel('sticker-wall-changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, load)
      .on('postgres_changes', { event:'*', schema:'public', table:'stamps' }, load)
      .on('postgres_changes', { event:'*', schema:'public', table:'redemptions' }, load)
      .on('postgres_changes', { event:'*', schema:'public', table:'settings' }, load)
      .subscribe();
  }

  function render(){
    $('kidName').value = state.kidName || '';
    $('todayBadge').textContent = todayKey();
    $('thresholdInput').value = state.threshold;
    $('thresholdShow').textContent = state.threshold;

    const list = $('taskList');
    list.innerHTML = '';
    const doneToday = state.completions[todayKey()] || [];
    state.tasks.forEach((task,idx)=>{
      const done = doneToday.includes(task.id);
      const row = document.createElement('div');
      row.className = 'task';
      row.innerHTML = `
        <div class="task-icon">${taskIcon(task.label, idx)}</div>
        <span class="label">${task.label}</span>
        <button class="stamp-btn" ${done?'disabled':''} data-id="${task.id}">${done?'✓ 已蓋章':'蓋章'}</button>
        <button class="remove-btn" data-remove="${task.id}">✕</button>
      `;
      list.appendChild(row);
    });

    const stickerCount = currentStickerCount();
    $('stickerCount').textContent = stickerCount;
    const pct = Math.min(100, Math.round((stickerCount / state.threshold) * 100));
    $('progressFill').style.width = pct + '%';
    const ready = stickerCount >= state.threshold;
    $('redeemBtn').disabled = !ready;
    $('redeemBtn').classList.toggle('ready', ready);

    const grid = $('stickerGrid');
    grid.innerHTML = '';
    // 不限格數：只畫出已經蓋章、還沒兌換掉的貼紙，蓋越多自動往下長
    const visibleStamps = state.stamps.slice(state.redeemedTotal);
    visibleStamps.forEach(s=>{
      const slot = document.createElement('div');
      slot.className = 'sticker-slot filled';
      slot.innerHTML = stickerShape(s.sticker_seed || 0);
      grid.appendChild(slot);
    });
    $('emptyHint').style.display = stickerCount ? 'none' : 'block';
  }

  $('saveNameBtn').addEventListener('click', async ()=>{
    state.kidName = $('kidName').value.trim();
    try{
      await sb.from('settings').update({ child_name: state.kidName, updated_at: new Date().toISOString() }).eq('family_code', FAMILY_CODE);
      toast('已儲存');
    }catch(e){ dbError(e); }
  });

  $('addTaskBtn').addEventListener('click', async ()=>{
    const val = $('newTaskInput').value.trim();
    if(!val) return;
    $('newTaskInput').value = '';
    try{
      const { data, error } = await sb.from('tasks').insert({
        family_code: FAMILY_CODE, label: val, sort_order: state.tasks.length
      }).select().single();
      if(error) throw error;
      state.tasks.push({id:data.id, label:data.label});
      render();
    }catch(e){ dbError(e); }
  });
  $('newTaskInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') $('addTaskBtn').click();
  });

  async function completeStamp(taskId){
    const key = todayKey();
    if(!state.completions[key]) state.completions[key] = [];
    if(state.completions[key].includes(taskId)) return;
    const identity = getIdentity() || 'child';
    const seed = Math.floor(Math.random()*1000);
    try{
      const { data, error } = await sb.from('stamps').insert({
        family_code: FAMILY_CODE, task_id: taskId, stamped_by: identity, sticker_seed: seed
      }).select().single();
      if(error) throw error;
      state.completions[key].push(taskId);
      state.stamps.push(data);
      render();
    }catch(e){ dbError(e); }
  }

  $('taskList').addEventListener('click', async e=>{
    const stampId = e.target.dataset.id;
    const removeId = e.target.dataset.remove;
    if(stampId){
      openStampOverlay(stampId);
    }
    if(removeId){
      try{
        const { error } = await sb.from('tasks').delete().eq('id', removeId);
        if(error) throw error;
        state.tasks = state.tasks.filter(t=>t.id !== removeId);
        render();
      }catch(e){ dbError(e); }
    }
  });

  const stampHint = $('stampHint');
  const scanText = $('scanText');

  function openStampOverlay(taskId){
    pendingTaskId = taskId;
    resetInk();
    stampHint.textContent = '按住指紋不放';
    overlay.classList.add('show');
  }
  function closeStampOverlay(){
    overlay.classList.remove('show');
    pendingTaskId = null;
    cancelHold();
  }
  function resetInk(){
    inkRect.setAttribute('y', PAD_BOTTOM);
    inkRect.setAttribute('height', 0);
  }
  function setInk(progress){
    const h = progress * PAD_FULL_H;
    inkRect.setAttribute('y', PAD_BOTTOM - h);
    inkRect.setAttribute('height', h);
  }
  function cancelHold(){
    if(holdRAF) cancelAnimationFrame(holdRAF);
    holdRAF = null; holdStart = null;
    resetInk();
    stampPad.classList.remove('pressing');
    stampPadWrap.classList.remove('pressing');
    scanText.classList.remove('active');
    stampBadge.classList.remove('show');
    stampImpact.classList.remove('show');
    rippleRing.classList.remove('show');
    stampCard.classList.remove('shake');
    stampPadWrap.classList.remove('landed');
    stampHint.textContent = '按住指紋不放';
  }
  function startHold(){
    if(!pendingTaskId) return;
    stampPad.classList.add('pressing');
    stampPadWrap.classList.add('pressing');
    scanText.classList.add('active');
    stampHint.textContent = '別放開⋯';
    holdStart = performance.now();
    const tick = (now)=>{
      const progress = Math.min(1, (now - holdStart) / HOLD_MS);
      setInk(progress);
      if(progress >= 1){
        finishStamp();
        return;
      }
      holdRAF = requestAnimationFrame(tick);
    };
    holdRAF = requestAnimationFrame(tick);
  }
  function finishStamp(){
    if(holdRAF) cancelAnimationFrame(holdRAF);
    holdRAF = null;
    stampPad.classList.remove('pressing');
    stampPadWrap.classList.remove('pressing');
    stampPad.classList.add('done');
    scanText.classList.remove('active');
    stampBadge.classList.add('show');
    stampImpact.classList.add('show');
    rippleRing.classList.add('show');
    stampCard.classList.add('shake');
    stampPadWrap.classList.add('landed');
    stampHint.textContent = '蓋好了！🎉';
    const id = pendingTaskId;
    setTimeout(()=>{
      completeStamp(id);
      stampPad.classList.remove('done');
      closeStampOverlay();
      toast('蓋章成功！🎉');
    }, 1700);
  }

  stampPad.addEventListener('pointerdown', e=>{ e.preventDefault(); startHold(); });
  stampPad.addEventListener('pointerup', cancelHold);
  stampPad.addEventListener('pointerleave', cancelHold);
  stampPad.addEventListener('pointercancel', cancelHold);
  $('stampOverlayClose').addEventListener('click', closeStampOverlay);
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeStampOverlay(); });

  $('thresholdInput').addEventListener('change', async e=>{
    const v = parseInt(e.target.value,10);
    state.threshold = (v && v>0) ? v : 10;
    render();
    try{
      await sb.from('settings').update({ redeem_threshold: state.threshold, updated_at: new Date().toISOString() }).eq('family_code', FAMILY_CODE);
    }catch(e){ dbError(e); }
  });

  $('redeemBtn').addEventListener('click', async ()=>{
    const count = currentStickerCount();
    if(count < state.threshold) return;
    try{
      const { error } = await sb.from('redemptions').insert({
        family_code: FAMILY_CODE, stickers_used: state.threshold
      });
      if(error) throw error;
      state.redeemedTotal += state.threshold;
      render();
      toast('兌換成功！記得給孩子獎勵 🎁');
    }catch(e){ dbError(e); }
  });

  load();
})();
</script>
